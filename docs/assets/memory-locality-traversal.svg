  <text x="725.7459999999999" y="281.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="725.7459999999999" dy="-3.9000000000000012">Column 0 pass</tspan><tspan x="725.7459999999999" dy="16.900000000000002">row 0 f0</tspan></text>
