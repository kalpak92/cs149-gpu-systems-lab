  <text x="467.11949999999996" y="157.15" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="467.11949999999996" dy="-12.350000000000001">Higher-level loop or parallel language</tspan><tspan x="467.11949999999996" dy="16.900000000000002">Compiler proves that iterations</tspan><tspan x="467.11949999999996" dy="16.900000000000002">can be vectorized</tspan></text>
</g>
