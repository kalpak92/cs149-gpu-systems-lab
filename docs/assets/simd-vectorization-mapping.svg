</g>
<g class="node" data-id="loads" data-label="Load eight adjacent A and B elements
into vector registers vA and vB" data-shape="rectangle">
  <rect x="194.3515" y="333.70000000000005" width="256.84" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="322.77149999999995" y="360.6" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="322.77149999999995" dy="-3.9000000000000012">Load eight adjacent A and B elements</tspan><tspan x="322.77149999999995" dy="16.900000000000002">into vector registers vA and vB</tspan></text>
</g>
<g class="node" data-id="vadd" data-label="One VADD instruction
vC = vA + vB" data-shape="rectangle">
  <rect x="238.81149999999997" y="415.50000000000006" width="167.92000000000002" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="322.77149999999995" y="442.40000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="322.77149999999995" dy="-3.9000000000000012">One VADD instruction</tspan><tspan x="322.77149999999995" dy="16.900000000000002">vC = vA + vB</tspan></text>
</g>
<g class="node" data-id="results" data-label="Eight element-wise results
