  <text x="466.9454999999999" y="230.65" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Inferred mapping</text>
</g>
<g class="node" data-id="intent" data-label="Scalar loop intent
one C element = one A element + one B element" data-shape="rectangle">
  <rect x="169.8985" y="40" width="305.746" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="322.7715" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="322.7715" dy="-3.9000000000000012">Scalar loop intent</tspan><tspan x="322.7715" dy="16.900000000000002">one C element = one A element + one B element</tspan></text>
</g>
