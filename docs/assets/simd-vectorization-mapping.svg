  <rect x="226.58499999999998" y="497.30000000000007" width="192.37299999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="322.77149999999995" y="524.2" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="322.77149999999995" dy="-3.9000000000000012">Eight element-wise results</tspan><tspan x="322.77149999999995" dy="16.900000000000002">eight adjacent C elements</tspan></text>
</g>
