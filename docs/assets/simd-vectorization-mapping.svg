  <text x="178.4235" y="157.15" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="178.4235" dy="-12.350000000000001">Intrinsics</tspan><tspan x="178.4235" dy="16.900000000000002">Programmer explicitly names</tspan><tspan x="178.4235" dy="16.900000000000002">vector loads, registers, VADD, and store</tspan></text>
</g>
