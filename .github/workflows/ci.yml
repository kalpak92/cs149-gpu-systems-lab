name: Validate repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .agents/skills/pretty-mermaid/package-lock.json

      - name: Validate Python syntax
        run: python -m compileall -q scripts experiments

      - name: Validate shell syntax
        run: |
          bash -n experiments/00_machine-baseline/sample_gpu_state.sh
          bash -n experiments/01_cpu-thread-scaling/run_experiment.sh

      - name: Validate C++ and OpenMP syntax
        run: |
          g++ \
            -std=c++20 \
            -fopenmp \
            -Wall \
            -Wextra \
            -Wpedantic \
            -fsyntax-only \
            experiments/01_cpu-thread-scaling/thread_scaling.cpp

      - name: Validate repository documentation
        run: python scripts/validate_repository.py

      - name: Install Mermaid renderer dependencies
        working-directory: .agents/skills/pretty-mermaid
        run: npm ci

      - name: Test Mermaid renderer
        working-directory: .agents/skills/pretty-mermaid
        run: npm test

      - name: Validate Mermaid renderer documentation
        working-directory: .agents/skills/pretty-mermaid
        run: npm run validate

      - name: Check generated Mermaid asset
        run: |
          node .agents/skills/pretty-mermaid/scripts/render.mjs \
            --input docs/diagrams/experiment-00-gpu-usability.mmd \
            --output "${RUNNER_TEMP}/experiment-00-gpu-usability-flow.svg" \
            --theme zinc-light \
            --font sans-serif \
            --node-spacing 16 \
            --layer-spacing 28
          cmp \
            docs/assets/experiment-00-gpu-usability-flow.svg \
            "${RUNNER_TEMP}/experiment-00-gpu-usability-flow.svg"
